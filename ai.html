<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOM AI - Chat Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'blob': 'blob 7s infinite',
                        // Increased fade-in duration for a softer, more "liquid" feel
                        'fade-in': 'fadeIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards', 
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Modern Scrollbar Styling */
        .chat-container-scroll::-webkit-scrollbar { width: 6px; }
        .chat-container-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-container-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        .chat-container-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }

        /* Glassmorphism Utilities (Main Panel) */
        .glass-panel {
            /* Increased blur for depth and reduced background opacity slightly for liquid look */
            background: rgba(17, 24, 39, 0.65); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); /* Brighter border for definition */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* Stronger shadow */
        }

        /* Glassmorphism Utilities (User Bubble - Gradient for vibrancy) */
        .glass-bubble-user {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(147, 51, 234, 0.7));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); /* Blue shadow for depth */
            border-top-right-radius: 6px !important; /* Defined sharp corner */
        }

        /* Glassmorphism Utilities (AI Bubble - Subtle white for sophistication) */
        .glass-bubble-ai {
            background: rgba(255, 255, 255, 0.08); /* Slightly more visible */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-top-left-radius: 6px !important; /* Defined sharp corner */
        }

        /* Markdown Styles within Chat */
        .prose pre { 
            background: rgba(0,0,0,0.6) !important; 
            padding: 12px; 
            border-radius: 10px; 
            overflow-x: auto; 
            border: 1px solid rgba(255,255,255,0.15);
        }
        .prose code { 
            color: #e2e8f0; 
            font-family: monospace; 
            background: rgba(255,255,255,0.15); 
            padding: 2px 4px; 
            border-radius: 4px; 
        }
        .prose p { margin-bottom: 0.5rem; }
        .prose ul, .prose ol { margin-left: 1.5rem; padding-left: 0; }
        .prose li { margin-bottom: 0.25rem; }
        .prose strong { color: #f1f5f9; } /* Lighter white */
        
        /* Loading Dots */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
            background-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: inline-block;
            height: 7px; /* Slightly larger */
            width: 7px; /* Slightly larger */
            margin: 0 3px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen overflow-hidden relative font-sans selection:bg-blue-500 selection:text-white">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-[2000ms]"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-pink-500 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-[4000ms]"></div>
    </div>

    <div class="relative z-10 flex flex-col h-full max-w-4xl mx-auto glass-panel border-x border-white/5 shadow-2xl rounded-xl overflow-hidden my-4">
        
        <header class="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-gray-900/40 backdrop-blur-lg sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-400 to-purple-400 flex items-center justify-center shadow-xl">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                </div>
                <h1 class="font-extrabold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-purple-300">JOM AI Assistant</h1>
            </div>
            <button onclick="clearChat()" class="px-3 py-1 bg-white/10 hover:bg-white/20 text-xs text-gray-200 rounded-lg transition-colors uppercase tracking-wider font-medium border border-white/10 shadow-inner">
                Reset Memory
            </button>
        </header>

        <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center z-0 transition-opacity duration-500">
            <div class="w-32 h-32 rounded-3xl glass-bubble-ai flex items-center justify-center mb-6 shadow-2xl border border-white/10">
                <svg class="w-16 h-16 text-blue-300 opacity-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2v2M12 20v2M20 12h2M2 12h2M14.32 16.68a2 2 0 0 1-2.83 0L10 14.5l-1.49 1.49a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83L7.5 10l-1.49-1.49a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0L10 9.5l1.49-1.49a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83L14.5 12l1.49 1.49a2 2 0 0 1 0 2.83z" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Ask Me Anything</h2>
            <p class="text-gray-400 text-lg">I can summarize Jomari's skills, experience, and projects.</p>
            <p class="text-gray-500 text-sm mt-1">Powered by JOM AI</p>
        </div>

        <div id="chat-container" class="chat-container-scroll flex-grow overflow-y-auto p-4 md:p-6 space-y-4 scroll-smooth z-10">
        </div>

        <div class="p-4 border-t border-white/10 bg-gray-900/60 backdrop-blur-xl">
            <div class="relative max-w-3xl mx-auto flex items-end gap-2 bg-gray-800/60 border border-white/15 rounded-2xl p-2 shadow-xl focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30 transition-all duration-300">
                <textarea 
                    id="user-input" 
                    rows="1" 
                    placeholder="Message JOM AI (Shift+Enter for new line)" 
                    class="w-full bg-transparent text-gray-100 placeholder-gray-500 text-base px-3 py-2.5 focus:outline-none resize-none max-h-40 overflow-y-auto scrollbar-hide"
                    oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
                ></textarea>
                <button 
                    id="send-btn" 
                    class="p-3 bg-gradient-to-tr from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl shadow-lg transition-all transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-[10px] text-gray-500">AI can make mistakes. Always verify information, especially dates and facts.</p>
            </div>
        </div>
    </div>

    <script type="module">
        // ================= CONFIGURATION =================
        const API_KEY = "AIzaSyA8zT06IPiBqznQoAdCfLHzqulQtFdwZsc"; // Use the provided API key logic
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025"; 
        
        // Jomari's complete profile data, injected into the AI system instruction
        const JOM_PROFILE_DATA = {
            name: "Jomari",
            about: "I am an enthusiastic, self-motivated, reliable, responsible and hard working person. I am a mature team worker and adaptable to all challenging situations. I am able to work well both in a team environment as well as using own initiative. I am able to work well under pressure and adhere to strict deadlines.",
            skills: {
                soft: ["Communication", "Creativity", "Time Management", "Technology", "Color Theory", "Problem Solving", "Planning and Organization", "Collaboration Skills", "Research", "Taking Criticism"],
                hard: ["Free Hand", "Typography", "Layout", "Acrobat", "HTML/CSS", "Sketching"],
                appDev: "Building Android/iOS apps"
            },
            experience: [
                { years: "2023 - Current", role: "Layout Ads Creator" },
                { years: "2022 - 2022", role: "Sales/Technician" },
                { years: "2020 - 2021", role: "Stock Clerk" },
                { years: "2017 - 2019", role: "Delivery Rider" },
                { years: "2016 - 2016", role: "Cellphone Technician" }
            ],
            education: [
                { years: "2023", course: "Information Technology" },
                { years: "2016", course: "Electronics Course" }
            ],
            services: [
                { title: "Editing", description: "When you write a book, you spend day after day scanning and identifying the trees. When you’re done, you have to step back and look at the forest." },
                { title: "App Designer", description: "As a designer, it’s important to think beyond apps and websites. Even if you’re working primarily in the digital space, remember that you’re literally surrounded by design. From architecture to fashion, right down to the simplest everyday objects..." },
                { title: "Web Developer", description: "Good code is its own best documentation. As you're about to add a comment, ask yourself, 'How can I improve the code so that this comment isn't needed?' Improve the code and then document it to make it even clearer." }
            ],
            contact: {
                email: "jomariabubo.grc@gmail.com",
                phone: "09659516196"
            }
        };

        const SYSTEM_INSTRUCTION_PROMPT = `You are JOM AI Assistant, an expert chatbot designed to answer questions about Jomari's professional background, skills, and experience. Use the following data as your sole knowledge source. Be helpful, concise, and professional.

Profile Data:
- Name: ${JOM_PROFILE_DATA.name}
- About Me: ${JOM_PROFILE_DATA.about}
- Soft Skills: ${JOM_PROFILE_DATA.skills.soft.join(', ')}
- Hard Skills: ${JOM_PROFILE_DATA.skills.hard.join(', ')}
- App Development Skill: ${JOM_PROFILE_DATA.skills.appDev}
- Education:
${JOM_PROFILE_DATA.education.map(e => `  - ${e.years}: ${e.course}`).join('\n')}
- Experience:
${JOM_PROFILE_DATA.experience.map(e => `  - ${e.years}: ${e.role}`).join('\n')}
- Services Offered:
${JOM_PROFILE_DATA.services.map(s => `  - ${s.title}: ${s.description}`).join('\n')}
- Contact Email: ${JOM_PROFILE_DATA.contact.email}
- Contact Phone: ${JOM_PROFILE_DATA.contact.phone}
`;
        
        // ================= STATE MANAGEMENT =================
        let chatHistory = []; 
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        // ================= UI FUNCTIONS =================

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(role, text, isLoading = false) {
            if (welcomeScreen.style.opacity !== '0') {
                welcomeScreen.style.opacity = '0';
                setTimeout(() => welcomeScreen.style.display = 'none', 500);
            }

            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            // Using flex for alignment and the 'animate-fade-in' class from Tailwind config
            msgDiv.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`; 
            
            const contentHtml = isUser ? text : marked.parse(text);
            
            // Adjusted classes for the liquid glass look
            const bubbleHtml = `
                <div class="max-w-[85%] md:max-w-[75%] rounded-3xl px-5 py-3.5 text-sm md:text-base leading-relaxed shadow-xl
                    ${isUser 
                        ? 'glass-bubble-user text-white rounded-br-md' // Sharp corner towards user
                        : 'glass-bubble-ai text-gray-100 rounded-bl-md' // Sharp corner towards AI
                    }">
                    ${isLoading ? 
                        `<div class="flex items-center gap-1 h-6">
                            <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
                        </div>` 
                        : `<div class="prose prose-invert max-w-none">${contentHtml}</div>`
                    }
                </div>
            `;

            msgDiv.innerHTML = bubbleHtml;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv; 
        }

        // ================= LOGIC & BRAIN (Updated for System Instruction) =================

        async function handleChat() {
            const text = userInput.value.trim();
            if (!text) return;

            // Using empty API_KEY as required for Canvas environment
            if (!API_KEY && typeof __app_id === 'undefined') {
                appendMessage('model', "⚠️ **Error:** API Key is not configured for a live application.");
                return;
            }

            userInput.value = '';
            userInput.style.height = 'auto';
            appendMessage('user', text);
            // Append the user query to history
            chatHistory.push({ role: "user", parts: [{ text: text }] });

            sendBtn.disabled = true;
            const loadingBubble = appendMessage('model', '', true);

            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION_PROMPT }]
                },
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2000,
                }
            };
            
            let attempts = 0;
            const maxAttempts = 5;
            let result = null;

            while (attempts < maxAttempts) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            // Rate limit exceeded, implement exponential backoff
                            const delay = Math.pow(2, attempts) * 1000;
                            attempts++;
                            if (attempts < maxAttempts) {
                                await new Promise(resolve => setTimeout(resolve, delay));
                                continue; // Retry the loop
                            }
                        }
                        throw new Error(`API Error: ${response.status} - ${await response.text()}`);
                    }

                    const data = await response.json();
                    result = data;
                    break; // Success, break the loop
                } catch (error) {
                    if (attempts === maxAttempts - 1) {
                         throw error; // Throw error on last attempt
                    }
                    const delay = Math.pow(2, attempts) * 1000;
                    attempts++;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }


            try {
                const aiText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                loadingBubble.remove();

                if (aiText) {
                    appendMessage('model', aiText);
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                } else {
                    // Handle blocked content or empty response
                    appendMessage('model', `❌ **Response Blocked or Empty.** The model may have deemed the content unsafe or returned no text.`);
                }

            } catch (error) {
                loadingBubble.remove();
                appendMessage('model', `❌ **Processing Error:** Could not parse AI response.`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ================= EVENT LISTENERS =================

        sendBtn.addEventListener('click', handleChat);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChat();
            }
        });

        window.clearChat = () => {
            chatHistory = [];
            chatContainer.innerHTML = '';
            welcomeScreen.style.display = 'flex';
            setTimeout(() => welcomeScreen.style.opacity = '1', 10);
        };
    </script>
</body>
</html>
